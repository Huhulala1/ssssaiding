<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#FFF7F0" />
<meta name="color-scheme" content="light" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="一起吃饭吧" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="format-detection" content="telephone=no,email=no" />
<meta name="description" content="一起吃饭吧 —— 中国家常菜 + 八大菜系的情侣点菜小程序：攸宝点单，我掌勺。" />
<title>一起吃饭吧 · 情侣点菜</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FFF3E9'/%3E%3Cpath d='M32 50s-13-8-13-17a8 8 0 0 1 13-6 8 8 0 0 1 13 6c0 9-13 17-13 17z' fill='%23FF6F5E'/%3E%3C/svg%3E" />
<style>
/* =========================================================
   一起吃饭吧 · 情侣`点菜
   奶油暖色 / 圆润可爱
   ========================================================= */

:root {
  --bg: #fff7f0;
  --bg-2: #fdede2;
  --card: #ffffff;
  --ink: #46302a;
  --ink-2: #7c5c52;
  --ink-3: #b08d80;
  --line: #f2e1d7;
  --line-2: #e8d3c6;
  --coral: #ff6f5e;
  --coral-d: #dd5440;
  --coral-soft: #ffe7e0;
  --honey: #ffc24b;
  --honey-soft: #fff2d4;
  --honey-ink: #96650a;
  --mint: #4fbfa0;
  --mint-soft: #dff4ec;
  --mint-ink: #1c7760;
  --lilac-soft: #ede7fb;
  --lilac-ink: #6b4fbf;
  --grey-soft: #f2ece7;
  --grey-ink: #8d7a71;

  --shadow-s: 0 6px 16px -10px rgba(122, 74, 58, 0.5);
  --shadow-m: 0 14px 32px -18px rgba(122, 74, 58, 0.5);
  --shadow-l: 0 26px 60px -28px rgba(122, 74, 58, 0.55);

  --app-w: 440px;
  --r-l: 24px;
  --r-m: 18px;
  --r-s: 13px;

  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  touch-action: manipulation;
  overscroll-behavior-y: none;
  -webkit-tap-highlight-color: transparent;
}

button { font-family: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
em { font-style: normal; }

/* 背景装饰 ------------------------------------------------- */
.bg-deco {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image: radial-gradient(rgba(190, 130, 105, 0.13) 1px, transparent 1px);
  background-size: 18px 18px;
  background-position: 0 0;
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.55;
}
.blob--a {
  width: 380px; height: 380px;
  top: -140px; left: -100px;
  background: radial-gradient(circle, #ffd9c8, transparent 68%);
}
.blob--b {
  width: 340px; height: 340px;
  top: 22%; right: -160px;
  background: radial-gradient(circle, #ffe9b8, transparent 68%);
}
.blob--c {
  width: 420px; height: 420px;
  bottom: -200px; left: 20%;
  background: radial-gradient(circle, #ffd6e0, transparent 70%);
}

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: var(--app-w);
  min-height: 100dvh;
  margin: 0 auto;
  padding-bottom: calc(108px + env(safe-area-inset-bottom));
}

/* 顶栏 ----------------------------------------------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(14px + env(safe-area-inset-top)) 18px 10px;
  background: var(--bg);
}
.topbar::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  height: 16px;
  background: linear-gradient(180deg, var(--bg), rgba(255, 247, 240, 0));
  pointer-events: none;
}

.hello {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.avatar {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 22px;
  line-height: 1;
  background: linear-gradient(150deg, #fff, #ffe6da);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9), var(--shadow-s);
}

.hello__text { min-width: 0; }
.hello__text h1 {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.2px;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hello__text p {
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.role-switch {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  padding: 3px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 13px;
  box-shadow: var(--shadow-s);
}
.role-switch button {
  border: 0;
  background: transparent;
  height: 28px;
  padding: 0 9px;
  border-radius: 10px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-3);
  cursor: pointer;
  transition: background 0.18s, color 0.18s;
}
.role-switch button.on {
  background: var(--ink);
  color: #fff7f0;
}

/* 页面主体 ------------------------------------------------- */
.view {
  padding: 4px 18px 20px;
}

.sec-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  margin: 12px 0 14px;
}
.sec-head h2 {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0.3px;
}
.sec-head p {
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--ink-3);
}

.dice {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 0;
  cursor: pointer;
  padding: 9px 12px;
  border-radius: 13px;
  background: var(--honey-soft);
  color: var(--honey-ink);
  font-size: 11.5px;
  font-weight: 800;
  box-shadow: 0 2px 0 rgba(214, 160, 52, 0.35);
  transition: transform 0.15s;
}
.dice:active { transform: translateY(2px); box-shadow: none; }

/* 分类胶囊 ------------------------------------------------- */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0 12px;
  margin: 0 -18px;
  padding-left: 18px;
  padding-right: 18px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.16s;
  white-space: nowrap;
}
.chip.on {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff7f0;
  box-shadow: 0 4px 12px -6px rgba(70, 48, 42, 0.8);
}

/* 菜品网格 ------------------------------------------------- */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.dish {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 8px 10px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 21px;
  background: var(--card);
  box-shadow: 0 8px 20px -15px rgba(122, 74, 58, 0.6);
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.3, 1.3), box-shadow 0.16s;
}
.dish:active { transform: scale(0.972); box-shadow: 0 3px 8px -6px rgba(122, 74, 58, 0.6); }

.dish__tile {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1.42 / 1;
  border-radius: 15px;
  overflow: hidden;
  isolation: isolate;
}
.dish__tile::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle at 50% 47%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.4) 40%, rgba(255, 255, 255, 0) 68%);
  z-index: -1;
}
.dish__tile::after {
  content: "";
  position: absolute;
  bottom: 8%;
  left: 50%;
  width: 46%;
  height: 12%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: rgba(120, 70, 50, 0.14);
  filter: blur(7px);
  z-index: -1;
}

.dish__emoji {
  font-size: 52px;
  line-height: 1;
  filter: drop-shadow(0 8px 10px rgba(120, 70, 50, 0.2));
  will-change: transform;
}
.dish__emoji.hop { animation: hop 0.42s cubic-bezier(0.2, 0.9, 0.3, 1.4); }

.dish__qty {
  position: absolute;
  top: 7px;
  right: 7px;
  min-width: 22px;
  height: 22px;
  padding: 0 5px;
  border-radius: 9px;
  display: none;
  place-items: center;
  background: var(--coral);
  color: #fff;
  font-size: 11.5px;
  font-weight: 800;
  box-shadow: 0 3px 8px -2px rgba(221, 84, 64, 0.7);
  animation: pop 0.24s cubic-bezier(0.2, 1.4, 0.4, 1);
}
.dish__qty.on { display: grid; }

.dish__off {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(255, 247, 240, 0.55);
  backdrop-filter: blur(1.5px);
  color: var(--ink-2);
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.5px;
}
.dish.is-off .dish__emoji { filter: grayscale(0.85) drop-shadow(0 6px 8px rgba(120, 70, 50, 0.1)); opacity: 0.75; }

.avail {
  position: absolute;
  left: 7px;
  top: 7px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 7px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.82);
  color: var(--ink-2);
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.2px;
  box-shadow: 0 2px 6px rgba(120, 70, 50, 0.12);
}
.avail i {
  width: 13px;
  height: 8px;
  border-radius: 999px;
  background: #d9cfc9;
  position: relative;
  transition: background 0.18s;
}
.avail i::after {
  content: "";
  position: absolute;
  top: 1px;
  left: 1px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.18s;
}
.avail i.on { background: var(--mint); }
.avail i.on::after { transform: translateX(5px); }

.dish__body { display: flex; flex-direction: column; gap: 3px; padding: 0 3px; }
.dish__name {
  font-size: 13.5px;
  font-weight: 800;
  letter-spacing: 0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dish__desc {
  font-size: 10.5px;
  color: var(--ink-3);
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dish__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 3px;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-3);
}
.dish__add {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--coral);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  line-height: 1;
  box-shadow: 0 2.5px 0 var(--coral-d);
}
.dish.is-off .dish__add { background: #ded2cb; box-shadow: 0 2.5px 0 #c9bbb3; }

/* 私房菜占位卡 */
.dish--new {
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 200px;
  border: 1.5px dashed var(--line-2);
  background: rgba(255, 255, 255, 0.55);
  box-shadow: none;
  color: var(--ink-3);
}
.dish--new .plus {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: #fff;
  color: var(--coral);
  font-size: 22px;
  font-weight: 700;
  box-shadow: var(--shadow-s);
}
.dish--new b { font-size: 12px; font-weight: 800; color: var(--ink-2); }
.dish--new small { font-size: 10px; }

/* 色卡 ----------------------------------------------------- */
.tone-1 { background: linear-gradient(150deg, #ffe6d6, #ffcfba); }
.tone-2 { background: linear-gradient(150deg, #fff3d2, #ffe2a6); }
.tone-3 { background: linear-gradient(150deg, #e3f6ec, #c8ebdb); }
.tone-4 { background: linear-gradient(150deg, #ffe9ef, #ffd1de); }
.tone-5 { background: linear-gradient(150deg, #eaeffb, #d6e1f8); }
.tone-6 { background: linear-gradient(150deg, #f3eafb, #e5d6f6); }

/* 大厨提示 ------------------------------------------------- */
.chef-tip {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 13px 14px;
  margin-bottom: 14px;
  border-radius: var(--r-m);
  background: linear-gradient(135deg, #fff6e6, #ffe9d6);
  border: 1px solid #ffe2c2;
  box-shadow: var(--shadow-s);
}
.chef-tip > span { font-size: 20px; line-height: 1.1; }
.chef-tip__av {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: #fff;
  font-size: 16px;
  box-shadow: 0 6px 12px -8px rgba(122, 74, 58, 0.9);
}
.chef-tip b { font-size: 12.5px; font-weight: 800; display: block; }
.chef-tip p { margin-top: 3px; font-size: 11px; line-height: 1.5; color: var(--ink-2); }

/* 空状态 --------------------------------------------------- */
.empty {
  text-align: center;
  padding: 40px 20px 30px;
  color: var(--ink-3);
  background: rgba(255, 255, 255, 0.72);
  border: 1.5px dashed var(--line-2);
  border-radius: 22px;
  margin-top: 4px;
}
.empty__emoji { font-size: 46px; display: block; margin-bottom: 12px; filter: saturate(0.9); }
.empty b { display: block; font-size: 14.5px; color: var(--ink); font-weight: 800; margin-bottom: 6px; }
.empty p { font-size: 11.5px; line-height: 1.65; }
.empty .btn { margin-top: 16px; }

.footnote {
  margin-top: 20px;
  text-align: center;
  font-size: 10.5px;
  color: #c4a79a;
  letter-spacing: 0.3px;
}

/* 订单 ----------------------------------------------------- */
.order-list { display: flex; flex-direction: column; gap: 14px; }

.receipt {
  position: relative;
  background: var(--card);
  border-radius: 20px;
  padding: 14px 15px;
  box-shadow: var(--shadow-m);
  animation: rise-sm 0.32s ease both;
}
.receipt__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.receipt__no {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 1px;
}
.receipt__no b { color: var(--ink-2); font-size: 12px; }

.perf {
  position: relative;
  margin: 11px -15px;
  border-top: 1.5px dashed var(--line-2);
}
.notch {
  position: absolute;
  top: -8px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--bg);
  box-shadow: inset 0 1px 2px rgba(122, 74, 58, 0.06);
}
.notch.l { left: -7.5px; }
.notch.r { right: -7.5px; }

.ri {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 4px 0;
  font-size: 12.5px;
}
.ri__e {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: #fff5ee;
  font-size: 15px;
}
.ri__n { flex: 1; font-weight: 700; color: var(--ink); }
.ri b { font-size: 11.5px; color: var(--ink-3); font-weight: 700; }

.receipt__note {
  margin-top: 10px;
  padding: 9px 11px;
  border-radius: 12px;
  background: #fff6f1;
  border: 1px solid #ffe7dc;
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--ink-2);
}
.receipt__note::before { content: "「 "; color: var(--coral); font-weight: 800; }
.receipt__note::after { content: " 」"; color: var(--coral); font-weight: 800; }

.receipt__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 9px;
  font-size: 10.5px;
  color: var(--ink-3);
  font-weight: 600;
}

.receipt__chef > span:first-child { font-size: 15px; line-height: 1; }
.receipt__chef {
  margin-top: 10px;
  display: flex;
  gap: 7px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 11px;
  background: linear-gradient(120deg, #f3fbf8, #e8f7f1);
  font-size: 11.5px;
  color: var(--mint-ink);
  font-weight: 700;
}

.receipt__thanks > span:first-child { font-size: 15px; line-height: 1; }
.receipt__thanks {
  margin-top: 8px;
  display: flex;
  gap: 7px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 11px;
  background: #fff3f7;
  font-size: 11.5px;
  color: #b94b6c;
  font-weight: 700;
}

.receipt__log {
  margin-top: 9px;
  font-size: 9.5px;
  color: #c6ab9f;
  letter-spacing: 0.2px;
  line-height: 1.6;
}

.receipt__actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.receipt__actions .btn { flex: 1; }

/* 状态标签 ------------------------------------------------- */
.pill {
  flex: 0 0 auto;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.3px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.pill--pending { background: var(--honey-soft); color: var(--honey-ink); }
.pill--accepted { background: var(--mint-soft); color: var(--mint-ink); }
.pill--cooking { background: var(--coral-soft); color: var(--coral-d); }
.pill--served { background: #e8f6e9; color: #2f7d4f; }
.pill--declined,
.pill--cancelled { background: var(--grey-soft); color: var(--grey-ink); }
.pill__dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.pill--cooking .pill__dot { animation: blink 1.1s ease-in-out infinite; }
.pill--pending .pill__dot { animation: blink 1.6s ease-in-out infinite; }

/* 按钮 ----------------------------------------------------- */
.btn {
  border: 0;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 800;
  padding: 11px 14px;
  border-radius: 13px;
  background: #fff;
  color: var(--ink-2);
  transition: transform 0.12s, box-shadow 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translateY(1.5px); }
.btn--primary {
  background: linear-gradient(180deg, #ff8b78, var(--coral));
  color: #fff;
  box-shadow: 0 3px 0 var(--coral-d), 0 10px 20px -12px rgba(221, 84, 64, 0.9);
}
.btn--primary:active { box-shadow: 0 1px 0 var(--coral-d); }
.btn--ghost {
  background: #fff;
  color: var(--ink-2);
  border: 1px solid var(--line-2);
  box-shadow: 0 2px 0 var(--line);
}
.btn--ghost:active { box-shadow: 0 0 0 var(--line); }
.btn--block { width: 100%; }
.btn--big { padding: 15px 18px; font-size: 14.5px; border-radius: 17px; }
.btn--soft { background: var(--coral-soft); color: var(--coral-d); }

/* 底部购物栏 ----------------------------------------------- */
.cartbar-wrap {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(74px + env(safe-area-inset-bottom));
  width: min(100%, var(--app-w));
  padding: 0 16px;
  z-index: 45;
}
.cartbar-wrap .cartbar {
  animation: cart-in 0.28s cubic-bezier(0.2, 0.9, 0.3, 1) both;
}
@keyframes cart-in {
  from { opacity: 0; transform: translateY(14px) scale(0.98); }

}

.burst i {
  position: absolute;
  bottom: 16%;
  font-style: normal;
  animation: rise 1.6s cubic-bezier(0.15, 0.8, 0.3, 1) forwards;
  will-change: transform, opacity;
}

/* 动画 ----------------------------------------------------- */
@keyframes hop {
  0% { transform: translateY(0) scale(1); }
  35% { transform: translateY(-12px) scale(1.12) rotate(-4deg); }
  70% { transform: translateY(2px) scale(0.97); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes pop {
  from { transform: scale(0.4); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes beat {
  0%, 100% { transform: scale(1); }
  12% { transform: scale(1.22); }
  24% { transform: scale(1); }
  36% { transform: scale(1.12); }
  48% { transform: scale(1); }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slide-up {
  from { transform: translate(-50%, 102%); }
  to { transform: translate(-50%, 0); }
}
@keyframes rise-sm {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes toast-in {
  from { opacity: 0; transform: translate(-50%, -12px) scale(0.94); }
  to { opacity: 1; transform: translate(-50%, 0) scale(1); }
}
@keyframes rise {
  0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
  18% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx, 0), -46vh) scale(1.15) rotate(var(--rot, 20deg)); }
}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],

    浙菜: [3, 5], 湘菜: [1, 4], 闽菜: [5, 3], 徽菜: [2, 6], 东北菜: [2, 1],
    西北菜: [2, 1], 主食: [2, 3], 汤羹: [3, 5], 甜点: [4, 6], 饮品: [5, 3]
  };
  function toneFor(cat, i) {
    const pair = TONE_BY_CAT[cat] || [1, 3];
    return pair[i % pair.length];
  }

  function defaultState() {
    return {
      v: 2,
      menu: (window.SEED_MENU || []).map((d, i) => Object.assign({}, d, { available: true, tone: toneFor(d.cat, i) })),
      orders: [],
      profile: {
        orderer: { name: '攸宝', avatar: '🐰' },
        chef: { name: '大厨', avatar: '🐻' }
      }
    };
  }

  function hydrate(d) {
    if (!d || !Array.isArray(d.menu)) return null;
    d.orders = Array.isArray(d.orders) ? d.orders : [];
    d.profile = d.profile || {};
    d.profile.orderer = Object.assign({ name: '攸宝', avatar: '🐰' }, d.profile.orderer);
    d.profile.chef = Object.assign({ name: '大厨', avatar: '🐻' }, d.profile.chef);
    if (d.v !== 2) {
      if (d.profile.orderer.name === '宝贝') d.profile.orderer.name = '攸宝';
      d.menu = (window.SEED_MENU || []).map((x, i) => Object.assign({}, x, { available: true, tone: toneFor(x.cat, i) }));
      d.v = 2;
    }
    d.menu.forEach((x) => {
      if (!x.tone) x.tone = toneFor(x.cat, 0);
      if (typeof x.available !== 'boolean') x.available = true;
    });
    return d;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      return hydrate(JSON.parse(raw));
    } catch (err) {
      return null;
    }
  }

  let S = load();
  if (!S) {
    S = defaultState();
    try {
      localStorage.setItem(KEY, JSON.stringify(S));
    } catch (err) {}
  }

  const ui = {
    role: 'orderer',
    tab: 'menu',
    cat: '全部',
    filter: 'all',
    cart: {},
    meal: '今晚',
    mood: '饿扁了',
    draftNote: '',
    sheet: null,
    noteTarget: null,
    query: '',
    manageQuery: '',
    dishDraft: { id: null, name: '', emoji: '🍲', cat: '家常菜', mins: 20, desc: '' },
    fromManage: false,
    editProfile: { orderer: { name: '', avatar: '🐰' }, chef: { name: '', avatar: '🐻' } }
  };

  /* 初始身份 / 视图 */
  const roleParam = params.get('role');
  if (roleParam === 'chef' || roleParam === 'orderer') ui.role = roleParam;
  else {
    try {
      const saved = sessionStorage.getItem('et-role');
      if (saved === 'chef' || saved === 'orderer') ui.role = saved;
    } catch (err) {}
  }
  const tabParam = params.get('tab');
  if (['menu', 'orders', 'me'].includes(tabParam)) ui.tab = tabParam;

  /* ---------------- 存取 / 同步 ---------------- */
  let bc = null;
  try {
    bc = 'BroadcastChannel' in window ? new BroadcastChannel('eat-together') : null;
  } catch (err) {}

  const sync = { on: false, rev: 0, url: '', busy: false };

  function snapshot() {
    return { v: 2, menu: S.menu, orders: S.orders, profile: S.profile };
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(snapshot()));
    } catch (err) {}
    if (bc) {
      try {
        bc.postMessage({ t: 'sync' });
      } catch (err) {}
    }
    pushState();
  }

  function applyState(next) {
    const prevIds = new Set(S.orders.map((o) => o.id));
    const prevStatus = {};
    S.orders.forEach((o) => (prevStatus[o.id] = o.status));
    S = next;
    const fresh = S.orders.filter((o) => !prevIds.has(o.id));
    const servedNow = S.orders.filter((o) => prevStatus[o.id] && prevStatus[o.id] !== 'served' && o.status === 'served');
    render();
    if (ui.role === 'chef' && fresh.length) {
      celebrate();
      toast('新订单来啦，快看看 🛎');
    } else if (ui.role === 'orderer' && servedNow.length) {
      celebrate();
      toast('开饭啦！' + chef().name + '上菜了 🍲');
    }
  }

  function applyRemote() {
    const next = load();
    if (next) applyState(next);
  }

  /* 有 server.py 时自动开启跨设备同步；file:// 下只用 localStorage */
  async function pushState() {
    if (!sync.on) return;
    try {
      const res = await fetch(apiUrl('/api/state'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state: snapshot() })
      });
      if (res.ok) {
        const data = await res.json();
        if (data && data.rev) sync.rev = data.rev;
      }
    } catch (err) {}
  }

  async function pullState() {
    if (!sync.on || sync.busy || document.hidden) return;
    sync.busy = true;
    try {
      const res = await fetch(apiUrl('/api/state?since=' + sync.rev), { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      if (!data || !data.state) return;
      if ((data.rev || 0) <= sync.rev) return;
      const next = hydrate(data.state);
      if (!next) return;
      sync.rev = data.rev;
      sync.url = data.url || sync.url;
      applyState(next);
    } catch (err) {
    } finally {
      sync.busy = false;
    }
  }

  async function bootSync() {
    if (!apiBase && !/^https?:$/.test(location.protocol)) return;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4000);
      const res = await fetch(apiUrl('/api/state'), { cache: 'no-store', signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) return;
      const data = await res.json();
      sync.on = true;
      sync.url = data.url || location.origin + '/';
      if (data.state) {
        const next = hydrate(data.state);
        if (next) {
          S = next;
          sync.rev = data.rev || 0;
          render();
        }
      } else {
        await pushState();
      }
      setInterval(pullState, 1500);
    } catch (err) {
      sync.on = false;
    }
  }

  if (bc) bc.onmessage = (e) => { if (e.data && e.data.t === 'sync') applyRemote(); };
  window.addEventListener('storage', (e) => { if (e.key === KEY) applyRemote(); });

  /* ---------------- 小工具 ---------------- */
  function greeting() {
    const h = new Date().getHours();
    if (h < 5) return '深夜好';
    if (h < 11) return '早上好';
    if (h < 13) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }
  function timeStr(ts) {
    return new Date(ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  }
  function dayStr(ts) {
    const d = new Date(ts);
    const t = new Date();
    if (d.toDateString() === t.toDateString()) return '今天';
    const y = new Date(t.getTime() - 86400000);
    if (d.toDateString() === y.toDateString()) return '昨天';
    return d.getMonth() + 1 + '月' + d.getDate() + '日';
  }
  function cartCount() {
    return Object.values(ui.cart).reduce((a, b) => a + b, 0);
  }
  function orderer() { return S.profile.orderer; }
  function chef() { return S.profile.chef; }

  /* ---------------- 顶部 ---------------- */

    const p = isChef ? chef() : orderer();
    $('#helloAvatar').textContent = p.avatar;
    $('#helloTitle').textContent = p.name;

    $$('.role-switch button').forEach((b) => b.classList.toggle('on', b.dataset.role === ui.role));
  }

            : '') +

          (off && !isChef ? '<span class="dish__off">今天不做</span>' : '') +
        '</span>' +
        '<span class="dish__body">' +
          '<span class="dish__name">' + esc(d.name) + '</span>' +
          '<span class="dish__desc">' + esc(d.desc) + '</span>' +
          '<span class="dish__meta"><span>⏱ ' + d.mins + ' 分钟</span>' + (isChef ? '' : '<span class="dish__add">+</span>') + '</span>' +
        '</span>' +
      '</button>'
    );
  }

  function viewMenu() {
    const isChef = ui.role === 'chef';
    const cats = ['全部'].concat(Array.from(new Set(S.menu.map((d) => d.cat))));
    if (cats.indexOf(ui.cat) === -1) ui.cat = '全部';

    return (
      '<div class="sec-head">' +
        '<div><h2>' + (isChef ? '我的菜单' : '菜单') + '</h2>' +
        '<p>' + (isChef ? '点一下菜品，就能设置今天做不做' : '家常菜和八大菜系 · 共 ' + S.menu.length + ' 道') + '</p></div>' +
        (isChef
          ? '<button type="button" class="dice" data-act="newdish">＋ 加一道</button>'
          : '<button type="button" class="dice" data-act="random">🎲 抽一道</button>') +
      '</div>' +
      (isChef
        ? '<div class="chef-tip"><span class="chef-tip__av">' + chef().avatar + '</span><div><b>今天你掌勺</b><p>开关是绿色才算今天供应，关掉的菜' + orderer().name + '就点不到啦。</p></div></div>'
        : '') +
      '<div class="searchbox">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4.2 4.2"/></svg>' +
        '<input id="searchInput" type="search" autocomplete="off" enterkeyhint="search" placeholder="搜菜名，比如「红烧」「虾」" value="' + esc(ui.query) + '" />' +
      '</div>' +
      '<div class="chips">' +
        cats.map((c) => '<button type="button" class="chip' + (c === ui.cat ? ' on' : '') + '" data-act="cat" data-v="' + esc(c) + '">' + esc(c) + '</button>').join('') +
      '</div>' +
      '<div id="dishList">' + dishListHtml() + '</div>'
    );
  }

  function dishListHtml() {
    const isChef = ui.role === 'chef';
    const q = ui.query.trim();
    const list = q
      ? S.menu.filter((d) => (d.name + ' ' + d.desc + ' ' + d.cat).indexOf(q) > -1)
      : S.menu.filter((d) => ui.cat === '全部' || d.cat === ui.cat);

    return (
      '<div class="grid">' + list.map(dishCard).join('') + '</div>' +
      (list.length
        ? q || ui.cat !== '全部'
          ? '<p class="footnote">共 ' + list.length + ' 道</p>'
          : ''
        : emptyBlock('🍽️', q ? '没找到这道菜' : '这个分类还空着', q ? '换个关键词试试，或者去「我们 → 管理菜单」自己加' : '去「我们 → 管理菜单」加一道吧'))
    );
  }

  function refreshDishList() {
    const box = document.getElementById('dishList');
    if (box) box.innerHTML = dishListHtml();
  }

  /* ---------------- 订单页 ---------------- */
  function receipt(o) {
    const isChef = ui.role === 'chef';
    const st = STATUS[o.status] || STATUS.pending;
    const items = o.items
      .map(
        (i) =>
          '<div class="ri"><span class="ri__e">' + i.emoji + '</span><span class="ri__n">' + esc(i.name) + '</span><b>×' + i.qty + '</b></div>'
      )
      .join('');
    const note = o.note ? '<div class="receipt__note">' + esc(o.note) + '</div>' : '';
    const chefNote = o.chefNote
      ? '<div class="receipt__chef"><span>' + chef().avatar + '</span><span>' + esc(chef().name) + '：' + esc(o.chefNote) + '</span></div>'
      : '';
    const thanks =
      o.thanks && o.thanks.length
        ? '<div class="receipt__thanks"><span>' + orderer().avatar + '</span><span>' + esc(o.thanks[o.thanks.length - 1]) + '</span></div>'
        : '';
    let log = '';
    if (o.timeline && o.timeline.length > 1) {
      log = o.timeline.map((t) => (LOG_LABEL[t.s] || '') + ' ' + timeStr(t.at)).join(' · ');
    } else if (o.status === 'pending') {
      const waited = Math.max(0, Math.round((Date.now() - o.createdAt) / 60000));
      log = waited < 1 ? '刚刚下单，等' + chef().name + '看到' : '已等 ' + waited + ' 分钟';
    }
    const actions = actionsFor(o, isChef);

    return (
      '<article class="receipt">' +
        '<div class="receipt__top">' +
          '<span class="receipt__no">No.<b>' + esc(o.no) + '</b></span>' +
          '<span class="pill pill--' + st.cls + '"><i class="pill__dot"></i>' + st.label + '</span>' +
        '</div>' +
        '<div class="perf"><i class="notch l"></i><i class="notch r"></i></div>' +
        items +
        note +
        '<div class="receipt__meta"><span>' + (MEAL_ICON[o.meal] || '🕗') + ' ' + esc(o.meal) + '</span><span>😋 ' + esc(o.mood || '饿了') + '</span><span>' + dayStr(o.createdAt) + ' ' + timeStr(o.createdAt) + '</span></div>' +
        chefNote +
        thanks +
        (log ? '<div class="receipt__log">' + log + '</div>' : '') +
        (actions ? '<div class="receipt__actions">' + actions + '</div>' : '') +
      '</article>'
    );
  }

  function actionsFor(o, isChef) {
    const id = o.id;
    if (isChef) {
      if (o.status === 'pending')
        return (
          '<button type="button" class="btn btn--ghost" data-act="order" data-id="' + id + '" data-to="declined">今天不行</button>' +
          '<button type="button" class="btn btn--primary" data-act="order" data-id="' + id + '" data-to="accepted">接单</button>'
        );
      if (o.status === 'accepted')
        return '<button type="button" class="btn btn--primary" data-act="order" data-id="' + id + '" data-to="cooking">开始做菜 🔥</button>';
      if (o.status === 'cooking')
        return '<button type="button" class="btn btn--primary" data-act="order" data-id="' + id + '" data-to="served">上菜啦 🍲</button>';
      return '';
    }
    if (o.status === 'pending')
      return (
        '<button type="button" class="btn btn--ghost" data-act="order" data-id="' + id + '" data-to="cancelled">再想想</button>' +
        '<button type="button" class="btn btn--primary" data-act="note" data-id="' + id + '">补一句</button>'
      );
    if (o.status === 'accepted')
      return '<button type="button" class="btn btn--ghost btn--block" data-act="note" data-id="' + id + '">跟' + esc(chef().name) + '说一句</button>';
    if (o.status === 'served' && !(o.thanks && o.thanks.length))
      return '<button type="button" class="btn btn--primary btn--block" data-act="thank" data-id="' + id + '">说声谢谢 ❤️</button>';
    return '';
  }

    const list = S.orders.filter((o) =>
      ui.filter === 'all' ? true : ui.filter === 'active' ? ACTIVE.indexOf(o.status) > -1 : ACTIVE.indexOf(o.status) === -1
    );

    if (S.orders.length === 0) {
      empty = isChef
        ? emptyBlock('🛎', '还没有订单', '等' + esc(orderer().name) + '来点菜吧，菜单随时会更新。', '<button type="button" class="btn btn--primary" data-act="tab" data-tab="menu">去看看菜单</button>')
        : emptyBlock('🥢', '还没点过菜', '挑两道想吃的，' + esc(chef().name) + '那边马上就收到。', '<button type="button" class="btn btn--primary" data-act="tab" data-tab="menu">去点菜</button>');

  /* ---------------- 主渲染 ---------------- */
  function render() {
    renderHeader();
    const view = $('#view');
    view.innerHTML = ui.tab === 'menu' ? viewMenu() : ui.tab === 'orders' ? viewOrders() : viewMe();
    renderCartBar();

  function renderCartBar() {
    const wrap = $('#cartbarWrap');
    const n = cartCount();
    const show = ui.role === 'orderer' && ui.tab === 'menu' && n > 0;
    wrap.hidden = !show;
    if (!show) return;
    $('#cartCount').textContent = n + ' 份';
    $('#cartHint').textContent = Object.keys(ui.cart).length + ' 道菜 · ' + chef().name + '在等你的单';
  }

  function renderTabs() {
    $$('.tabbar .tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === ui.tab));
    const badge = $('#orderBadge');
    let c = 0;
    if (ui.role === 'chef') c = S.orders.filter((o) => o.status === 'pending').length;

  function shareUrl() {
    if (apiBase) return location.origin + location.pathname + '?api=' + encodeURIComponent(apiBase);
    if (sync.url) return sync.url;
    return location.origin + location.pathname;
  }

  function qrTag(text) {
    if (typeof qrcode !== 'function') return '';
    try {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      return qr.createSvgTag({ cellSize: 4, margin: 8, scalable: true, alt: '扫码打开' });
    } catch (err) {
      return '';
    }
  }

  function sheetScan() {
    const url = shareUrl();
    const tag = qrTag(url);
    const reachable = apiBase || sync.on;
    if (!reachable) {
      const hosted = /^https?:$/.test(location.protocol);
      return (
        sheetHead('微信扫码打开', hosted ? '还差一个同步服务' : '先在电脑上启动服务') +
        '<p class="about-text">' +
          (hosted

            : '现在是直接打开的网页文件，手机访问不到。<br><br>在电脑上进入这个文件夹，运行：<br><br><b>python3 server.py</b><br><br>或者按 README 部署到 GitHub Pages + 免费 Worker。') +
        '</p>' +

      sheetHead('微信扫码打开', apiBase ? '异地也能用，扫一下就行' : '手机和电脑连同一个 Wi-Fi') +
      '<div class="qrbox">' + (tag || '<p class="qrfallback">二维码没生成，直接复制下面的链接</p>') + '</div>' +
      '<p class="qrurl">' + esc(url) + '</p>' +

      '</div>'
    );

  /* ---------------- 动作 ---------------- */
  function addDish(id, delta) {
    if (ui.role !== 'orderer') return;
    const d = S.menu.find((x) => x.id === id);
    if (!d) return;
    if (d.available === false) {
      toast('这道今天不做哦');
      return;
    }
    const next = clamp((ui.cart[id] || 0) + (delta || 1), 0, 9);
    if (next) ui.cart[id] = next;
    else delete ui.cart[id];

    const card = document.querySelector('.dish[data-id="' + id + '"]');
    if (card) {
      const badge = card.querySelector('.dish__qty');
      if (badge) {
        badge.textContent = next;
        badge.classList.toggle('on', next > 0);
      }
      if (delta > 0) {
        const emoji = card.querySelector('.dish__emoji');
        if (emoji) {
          emoji.classList.remove('hop');
          void emoji.offsetWidth;
          emoji.classList.add('hop');
        }
      }
    }
    renderCartBar();
  }

  function submitOrder() {
    const items = Object.keys(ui.cart)
      .map((id) => {
        const d = S.menu.find((x) => x.id === id);
        return d ? { id: id, name: d.name, emoji: d.emoji, qty: ui.cart[id] } : null;
      })
      .filter(Boolean);
    if (!items.length) {
      toast('先点两道菜吧');
      return;
    }
    const note = ($('#noteInput') && $('#noteInput').value.trim()) || '';
    const maxNo = S.orders.reduce((m, o) => Math.max(m, parseInt(o.no, 10) || 0), 0);
    const now = Date.now();
    const order = {
      id: 'o' + now + Math.floor(Math.random() * 900),
      no: String(maxNo + 1).padStart(4, '0'),
      items: items,
      meal: ui.meal,
      mood: ui.mood,
      note: note,
      status: 'pending',
      createdAt: now,
      timeline: [{ s: 'pending', at: now }],
      chefNote: '',
      thanks: []
    };
    S.orders.unshift(order);
    ui.cart = {};
    ui.draftNote = '';
    closeSheet();
    ui.tab = 'orders';
    ui.filter = 'all';
    save();
    render();
    celebrate();
    toast('订单送到' + chef().name + '那边啦 🛎');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function orderAction(id, to) {
    const o = S.orders.find((x) => x.id === id);
    if (!o) return;
    const chefActs = ['accepted', 'cooking', 'served', 'declined'];
    const ordererActs = ['cancelled'];
    if (chefActs.indexOf(to) > -1 && ui.role !== 'chef') return;
    if (ordererActs.indexOf(to) > -1 && ui.role !== 'orderer') return;
    if (o.status === to) return;

    o.status = to;
    o.timeline = o.timeline || [];
    o.timeline.push({ s: to, at: Date.now() });
    if (to === 'accepted') o.chefNote = pick(CHEF_LINES.accept);
    if (to === 'served') o.chefNote = pick(CHEF_LINES.serve);
    if (to === 'declined') o.chefNote = pick(CHEF_LINES.decline);

    save();
    render();
    if (to === 'served') celebrate();
    const msg = {
      accepted: '接单啦，' + orderer().name + '那边已经看到',
      cooking: '开火！慢慢来，不着急',
      served: '上菜啦，这顿辛苦你了',
      declined: '已经婉拒，改天补上',
      cancelled: '订单取消啦'
    }[to];
    if (msg) toast(msg);
  }

  function toggleAvail(id) {
    const d = S.menu.find((x) => x.id === id);
    if (!d) return;
    d.available = d.available === false;
    save();
    render();
    toast(d.available ? '「' + d.name + '」今天供应' : '「' + d.name + '」今天先不做了');
  }

  function randomPick() {
    const pool = S.menu.filter((d) => d.available !== false);
    if (!pool.length) {
      toast('菜单空啦，先加两道菜');
      return;
    }
    const d = pick(pool);
    addDish(d.id, 1);
    toast('今天就吃「' + d.name + '」吧 🎲');
  }

  function openDishEditor(id) {
    if (id) {
      const d = S.menu.find((x) => x.id === id);
      if (!d) return;
      ui.dishDraft = { id: d.id, name: d.name, emoji: d.emoji, cat: d.cat, mins: d.mins, desc: d.desc || '' };
    } else {
      ui.dishDraft = { id: null, name: '', emoji: '🍲', cat: ui.cat === '全部' ? '家常菜' : ui.cat, mins: 20, desc: '' };
    }
    ui.fromManage = ui.sheet === 'manage';
    openSheet('editdish');
  }

  function saveDish() {
    const name = ($('#dishName') && $('#dishName').value.trim()) || '';
    if (!name) {
      toast('先给它起个名字');
      return;
    }
    const mins = clamp(parseInt($('#dishMins') && $('#dishMins').value, 10) || 20, 1, 240);
    const desc = ($('#dishDesc') && $('#dishDesc').value.trim()) || '自己加的菜，想吃就点';
    const d = ui.dishDraft;
    if (d.id) {
      const target = S.menu.find((x) => x.id === d.id);
      if (target) Object.assign(target, { name: name, emoji: d.emoji || '🍲', cat: d.cat, mins: mins, desc: desc });
    } else {
      S.menu.push({ id: 'c' + Date.now(), name: name, emoji: d.emoji || '🍲', desc: desc, cat: d.cat, mins: mins, tone: toneFor(d.cat, S.menu.length), available: true });
      ui.cat = d.cat;
      if (ui.tab !== 'menu') ui.tab = 'menu';
    }
    save();
    if (ui.fromManage) openSheet('manage');
    else closeSheet();
    render();
    toast('「' + name + '」' + (d.id ? '改好啦' : '已经写进菜单'));
  }

  function deleteDish() {
    const d = ui.dishDraft;
    if (!d.id) return;
    if (!window.confirm('把「' + d.name + '」从菜单里删掉？')) return;
    S.menu = S.menu.filter((x) => x.id !== d.id);
    save();
    if (ui.fromManage) openSheet('manage');
    else closeSheet();
    render();
    toast('已经删掉了');
  }

  function reseedMenu() {
    const total = (window.SEED_MENU || []).length;
    if (!window.confirm('把菜单恢复成默认的 ' + total + ' 道菜？自己加的和改过的菜会没掉，订单不受影响。')) return;
    S.menu = defaultState().menu;
    ui.cat = '全部';
    ui.query = '';
    save();
    render();
    toast('菜单已经恢复默认');
  }

  function saveProfile() {
    const on = ($('#editOrdererName') && $('#editOrdererName').value.trim()) || '攸宝';
    const cn = ($('#editChefName') && $('#editChefName').value.trim()) || '大厨';
    S.profile.orderer.name = on;
    S.profile.chef.name = cn;
    S.profile.orderer.avatar = ui.editProfile.orderer.avatar;
    S.profile.chef.avatar = ui.editProfile.chef.avatar;
    save();
    closeSheet();
    render();
    toast('改好啦');
  }

  function sendNote() {
    const txt = ($('#noteInput') && $('#noteInput').value.trim()) || '';
    if (!txt) {
      toast('写点什么吧');
      return;
    }
    const o = S.orders.find((x) => x.id === ui.noteTarget);
    if (!o) {
      closeSheet();
      return;
    }
    o.note = [o.note, txt].filter(Boolean).join('；');
    ui.draftNote = '';
    save();
    closeSheet();
    render();
    toast('已经告诉' + chef().name + '啦');
  }

  function thankChef(id) {
    const o = S.orders.find((x) => x.id === id);
    if (!o) return;
    o.thanks = o.thanks || [];
    o.thanks.push(pick(THANKS));
    save();
    render();
    celebrate();
    toast(chef().name + '看到会开心的 ❤️');
  }

  function seedDemo() {
    if (S.orders.length) {
      toast('已经有订单啦');
      return;
    }
    const now = Date.now();
    const find = (n) => S.menu.find((d) => d.name === n);
    const item = (n, qty) => {
      const d = find(n);
      return d ? { id: d.id, name: d.name, emoji: d.emoji, qty: qty } : null;
    };
    const mk = (names, meal, mood, note, status, agoMin, chefNote, thanks) => {
      const items = names.map((n) => item(n[0], n[1])).filter(Boolean);
      const t0 = now - agoMin * 60000;
      const o = {
        id: 'demo' + t0 + Math.floor(Math.random() * 99),
        no: String(S.orders.length + 1).padStart(4, '0'),
        items: items,
        meal: meal,
        mood: mood,
        note: note,
        status: 'pending',
        createdAt: t0,
        timeline: [{ s: 'pending', at: t0 }],
        chefNote: '',
        thanks: thanks || []
      };
      if (status !== 'pending') {
        const flow = { accepted: ['accepted'], cooking: ['accepted', 'cooking'], served: ['accepted', 'cooking', 'served'] }[status] || [];
        flow.forEach((s, i) => {
          o.status = s;
          o.timeline.push({ s: s, at: t0 + (i + 1) * 4 * 60000 });
          o.chefNote = s === 'accepted' ? '马上开火 🔥' : s === 'served' ? '上菜啦，趁热吃 🍲' : '';
        });
        if (status === 'served') o.thanks = thanks || [];
      }
      return o;
    };

    const a = mk(
      [['番茄炒蛋', 1], ['玉米排骨汤', 1], ['蛋炒饭', 1]],
      '今晚',
      '饿扁了',
      '想喝你煮的汤，少放点盐',
      'served',
      1600,
      '上菜啦，趁热吃 🍲',
      ['谢谢大厨，超好吃！']
    );
    const b = mk(
      [['可乐鸡翅', 2], ['蒜蓉青菜', 1]],
      '今晚',
      '想吃点好的',
      '今天有点累，想吃甜的',
      'pending',
      12
    );
    a.no = '0001';
    b.no = '0002';
    S.orders = [b, a];
    save();
    render();
    toast('示例订单已经放进去了');
  }

  function resetAll() {
    if (!window.confirm('清空所有菜单、订单和称呼？这个操作没办法撤销。')) return;
    try {
      localStorage.removeItem(KEY);
    } catch (err) {}
    S = defaultState();
    ui.cart = {};
    ui.cat = '全部';
    closeSheet();
    save();
    render();
    toast('已经清空，重新开始吧');
  }

  /* ---------------- 提示 / 撒花 ---------------- */
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.hidden = false;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.hidden = true;
    }, 2300);
  }

  function celebrate() {
    const layer = $('#burst');
    const emojis = ['❤️', '✨', '💛', '🌸', '🍽️', '💕'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('i');
      s.textContent = pick(emojis);
      s.style.left = 10 + Math.random() * 80 + '%';
      s.style.fontSize = 13 + Math.random() * 14 + 'px';
      s.style.setProperty('--dx', Math.random() * 180 - 90 + 'px');
      s.style.setProperty('--rot', Math.random() * 80 - 40 + 'deg');
      s.style.animationDelay = Math.random() * 0.3 + 's';
      layer.appendChild(s);
      setTimeout(() => s.remove(), 2100);
    }
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (el.hasAttribute('disabled')) return;
    syncDraft();

    switch (act) {
      case 'role':
        ui.role = el.dataset.role;
        try {
          sessionStorage.setItem('et-role', ui.role);
        } catch (err) {}
        render();
        break;
      case 'tab':
        ui.tab = el.dataset.tab;
        ui.filter = 'all';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        break;
      case 'cat':
        ui.cat = el.dataset.v;
        ui.query = '';
        render();
        break;
      case 'filter':
        ui.filter = el.dataset.v;
        render();
        break;
      case 'add':
        addDish(el.dataset.id, 1);
        break;
      case 'random':
        randomPick();
        break;
      case 'opencart':
        openSheet('cart');
        break;
      case 'inc':
        ui.cart[el.dataset.id] = clamp((ui.cart[el.dataset.id] || 0) + 1, 0, 9);
        renderSheet();
        renderCartBar();
        break;
      case 'dec': {
        const id = el.dataset.id;
        const n = (ui.cart[id] || 0) - 1;
        if (n <= 0) delete ui.cart[id];
        else ui.cart[id] = n;
        renderSheet();
        renderCartBar();
        break;
      }
      case 'meal':
        ui.meal = el.dataset.v;
        renderSheet();
        break;
      case 'mood':
        ui.mood = el.dataset.v;
        renderSheet();
        break;
      case 'notechip': {
        const t = $('#noteInput');
        if (t) {
          const v = el.dataset.v;
          t.value = t.value ? (t.value.slice(-1) === '，' ? t.value + v : t.value + '，' + v) : v;
          ui.draftNote = t.value;
        }
        break;
      }
      case 'submit':
        submitOrder();
        break;
      case 'order':
        orderAction(el.dataset.id, el.dataset.to);
        break;
      case 'note':
        openSheet('note', el.dataset.id);
        break;
      case 'sendnote':
        sendNote();
        break;
      case 'thank':
        thankChef(el.dataset.id);
        break;
      case 'avail':
        toggleAvail(el.dataset.id);
        break;
      case 'manage':
        openSheet('manage');
        break;
      case 'newdish':
        openDishEditor(null);
        break;
      case 'editdish':
        openDishEditor(el.dataset.id);
        break;
      case 'pickemoji':
        ui.dishDraft.emoji = el.dataset.v;
        renderSheet();
        break;
      case 'newcat':
        ui.dishDraft.cat = el.dataset.v;
        renderSheet();
        break;
      case 'savedish':
        saveDish();
        break;
      case 'deletedish':
        deleteDish();
        break;
      case 'canceldish':
        if (ui.fromManage) openSheet('manage');
        else closeSheet();
        break;
      case 'reseedmenu':
        reseedMenu();
        break;
      case 'scan':
        openSheet('scan');
        break;
      case 'cloud':
        openSheet('cloud');
        break;
      case 'saveapi': {
        const input = document.getElementById('apiInput');
        const url = ((input && input.value) || '').trim().replace(/\/+$/, '');
        if (!/^https?:\/\//.test(url)) {
          toast('地址要 http 或 https 开头');
          break;
        }
        try {
          localStorage.setItem('et-api', url);
        } catch (err) {}
        location.href = location.pathname;
        break;
      }
      case 'clearapi':
        try {
          localStorage.removeItem('et-api');
        } catch (err) {}
        location.href = location.pathname;
        break;
      case 'copylink': {
        const link = shareUrl();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(function () {
            toast('链接复制好了');
          }).catch(function () {
            toast(link);
          });
        } else {
          toast(link);
        }
        break;
      }
      case 'editprofile':
        openSheet('profile');
        break;
      case 'pickavatar':
        ui.editProfile[el.dataset.who].avatar = el.dataset.v;
        renderSheet();
        break;
      case 'saveprofile':
        saveProfile();
        break;
      case 'closesheet':
        closeSheet();
        break;
      case 'demo':
        seedDemo();
        break;
      case 'about':
        openSheet('about');
        break;
      case 'reset':
        resetAll();
        break;
      default:
        break;
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'searchInput') {
      ui.query = e.target.value;
      refreshDishList();
    } else if (e.target.id === 'manageSearch') {
      ui.manageQuery = e.target.value;
      const box = document.getElementById('manageList');
      if (box) box.innerHTML = manageListHtml();
    }
  });

  $('#backdrop').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && ui.sheet) closeSheet();
  });

  /* ---------------- 启动 ---------------- */
  if (params.get('demo') === '1' && S.orders.length === 0) seedDemo();

  if (params.get('sheet') === 'cart' && !Object.keys(ui.cart).length) {
    const a = S.menu[0];
    const b = S.menu[7] || S.menu[1];
    if (a) ui.cart[a.id] = 1;
    if (b) ui.cart[b.id] = 2;
  }

  render();

  if (params.get('sheet') === 'cart') openSheet('cart');
  if (params.get('sheet') === 'newdish') openSheet('newdish');
  if (params.get('sheet') === 'about') openSheet('about');
  if (params.get('sheet') === 'manage') openSheet('manage');
  if (params.get('sheet') === 'scan') openSheet('scan');

  bootSync();

  window.__app = {
    get S() { return S; },
    ui: ui,
    render: render,
    save: save,
    addDish: addDish,
    submitOrder: submitOrder,
    orderAction: orderAction
  };
})();

</script>
</body>
</html>
